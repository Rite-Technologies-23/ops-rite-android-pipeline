# Qodana JVM Community configuration -- free, no licence key, runs in Docker.
#
# This is the pipeline's cross-module dead-code detector: Qodana's
# UnusedDeclaration inspection resolves the whole project graph, so it finds
# unused public classes and functions that Detekt (single-file scope) cannot.
# It is the closest free equivalent to Python's vulture.
#
# Copied into the caller repo at CI time by the dead-code job.
version: "1.0"
linter: jetbrains/qodana-jvm-community:2024.3

profile:
  name: qodana.recommended

include:
  # --- dead code (the vulture equivalent) ---
  - name: UnusedDeclaration
  - name: UnusedSymbol
  - name: KotlinUnusedImport
  - name: UnusedReceiverParameter
  - name: RedundantVisibilityModifier
  - name: CanBeVal
  # --- correctness ---
  - name: KotlinConstantConditions
  - name: NullChecksToSafeCall

exclude:
  - name: All
    paths:
      - build
      - .gradle
      - .pipeline
      - "**/generated"
      - "**/src/test"
      - "**/src/androidTest"
  # DI graphs, serializers and Compose previews are referenced by generated code
  # or by tooling, so "unused" is a false positive for them.
  - name: UnusedDeclaration
    paths:
      - "**/di"
      - "**/preview"

# Report-only by default. Raise this once the baseline is triaged, or commit a
# qodana.sarif.json baseline and flip fail_on_dead_code in the workflow.
failThreshold: 0

# The qodana-jvm-community image only bundles a single JDK (21 as of the 2024.3
# linter), but callers commonly pin jvmToolchain(17) (Gradle's Java Toolchain
# API, distinct from just running Gradle itself under a given JDK) to match
# their app's compileOptions. With no toolchain resolver registered, Gradle
# refuses to auto-download a matching JDK and fails every task with "Cannot
# find a Java installation ... Toolchain download repositories have not been
# configured." Since this runs inside Qodana's own ephemeral checkout (never
# pushed back to the caller), prepend the toolchain resolver plugin to
# settings.gradle(.kts) here rather than requiring the caller to commit it --
# idempotent so a caller that already has it is left untouched.
bootstrap: |
  set -eu
  for f in settings.gradle.kts settings.gradle; do
    if [ -f "$f" ] && ! grep -q "foojay-resolver-convention" "$f"; then
      { printf 'plugins {\n    id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0"\n}\n\n'; cat "$f"; } > "$f.qodana-tmp"
      mv "$f.qodana-tmp" "$f"
    fi
  done
