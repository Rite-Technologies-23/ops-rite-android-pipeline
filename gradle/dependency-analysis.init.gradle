// gradle/dependency-analysis.init.gradle
// Injects the Dependency Analysis Gradle Plugin WITHOUT modifying the calling repo.
//
// This is the dependency-level half of dead-code analysis: it reports declared
// dependencies that are never used, dependencies used but not declared, and
// api/implementation misclassifications.
//
//   ./gradlew buildHealth   -> build/reports/dependency-analysis/build-health-report.txt
//
// Pinned to the last 1.x release (see DAGP_VERSION in push.yml), not 2.x.
// DAGP 2.x replaced this single project plugin with a Settings plugin
// ("com.autonomousapps.build-health") that, once applied, auto-applies
// "com.autonomousapps.dependency-analysis" to every subproject BY STRING ID
// internally (BuildHealthPlugin.kt). That internal apply-by-id can't resolve
// a plugin injected via this file's initscript{} classpath -- only
// apply-by-class works from that classpath (see CycloneDxPlugin below in
// cyclonedx.init.gradle for the same limitation) -- and the failing call is
// inside DAGP's own bytecode, so no init-script workaround fixes it.
//
// 1.x has no such split: a single plugin, applied once to the root project,
// analyzes every subproject on its own (confirmed via the plugin's own
// dependencyAnalysis extension, which is unchanged in shape between 1.x/2.x).

import com.autonomousapps.DependencyAnalysisPlugin

initscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath "com.autonomousapps:dependency-analysis-gradle-plugin:" +
                (System.getenv("DAGP_VERSION") ?: "1.33.0")
    }
}

beforeSettings { settings ->
    settings.dependencyResolutionManagement {
        repositories {
            google()
            mavenCentral()
            gradlePluginPortal()
        }
    }
}

gradle.rootProject { Project root ->
    // Applied by class -- see the note above and cyclonedx.init.gradle's
    // CycloneDxPlugin for why apply(String) doesn't work from this classpath.
    root.pluginManager.apply(DependencyAnalysisPlugin)
    root.extensions.configure("dependencyAnalysis") { ext ->
        // Report-only by default; the CI job decides whether to fail.
        ext.issues { issues ->
            issues.all { project ->
                project.onAny { it.severity((System.getenv("DAGP_SEVERITY") ?: "warn")) }
            }
        }
    }
}
