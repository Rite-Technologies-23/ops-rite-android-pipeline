// gradle/cyclonedx.init.gradle
// Injects the CycloneDX SBOM generator WITHOUT modifying the calling repo.
//
//   ./gradlew cyclonedxBom  -> build/reports/sbom/bom.json (+ bom.xml)
//
// The SBOM is what Trivy scans for known CVEs. Gradle has no lockfile in most
// Android projects, so an SBOM built from the resolved dependency graph is the
// only reliable free way to get a CVE gate in-CI.

def cyclonedxVersion = System.getenv("CYCLONEDX_VERSION") ?: "1.10.0"

initscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath "org.cyclonedx:cyclonedx-gradle-plugin:" +
                (System.getenv("CYCLONEDX_VERSION") ?: "1.10.0")
    }
}

beforeSettings { settings ->
    settings.dependencyResolutionManagement {
        repositories {
            google()
            mavenCentral()
            gradlePluginPortal()
        }
    }
}

import org.cyclonedx.gradle.CycloneDxPlugin
import org.gradle.api.artifacts.ProjectDependency

rootProject { Project root ->

    // cyclonedxBom refuses to run unless group/name/version are explicitly
    // set on the root project. Most Android apps never set these -- they
    // don't publish artifacts -- so root.group/root.version sit at Gradle's
    // defaults ("" / "unspecified"). Rather than requiring every caller repo
    // to add them to its own build.gradle.kts, fill in CI-derived fallbacks
    // here, but only when the caller hasn't already set real values.
    if (root.version == Project.DEFAULT_VERSION) {
        root.version = System.getenv("GITHUB_SHA") ?: "0.0.0"
    }
    if (root.group.toString().isEmpty()) {
        root.group = System.getenv("GITHUB_REPOSITORY") ?: root.name
    }

    // Applied by class -- apply plugin: "org.cyclonedx.bom" throws
    // UnknownPluginException from an initscript-only classpath (see spotless.init.gradle).
    root.pluginManager.apply(CycloneDxPlugin)

    def variant = (System.getenv("BUILD_VARIANT") ?: "Debug")
    def variantLower = variant.substring(0, 1).toLowerCase() + variant.substring(1)

    // Runtime graph of the variant under build -- that is what actually ships.
    def realConfigNames = [
            "${variantLower}RuntimeClasspath".toString(),
            "releaseRuntimeClasspath",
            "runtimeClasspath",
    ]

    def skipProjects = (System.getenv("CYCLONEDX_SKIP_PROJECTS") ?: "")
            .split(",")
            .collect { it.trim() }
            .findAll { !it.isEmpty() }

    root.tasks.named("cyclonedxBom").configure { t ->
        t.setOutputName("bom")
        t.setOutputFormat("all")
        t.setDestination(root.file("build/reports/sbom"))
        t.setIncludeBomSerialNumber(false)
        t.setSkipConfigs(["lintClassPath", "kapt*", "ksp*", "detekt*", "spotless*"])

        // Some local Android library modules expose a runtime configuration with
        // too many variants (aar-metadata, classes-jar, manifest, res, jni, ...)
        // for cyclonedxBom's own dependency-walking code to pick one from --
        // ArtifactSelectionException, not a real build problem (the actual app
        // build resolves these fine; only this task's introspection can't).
        //
        // skipProjects alone only stops such a module from being scanned as ITS
        // OWN target -- it does NOT stop the module from crashing resolution
        // when it shows up as a dependency INSIDE another project's runtime
        // configuration (e.g. :app's), which is what actually throws. Forcing a
        // fix via the caller's own build.gradle.kts (targetConfiguration =
        // "default") is NOT safe in general: it bypasses AGP's normal
        // variant-aware resolution for that dependency, which silently drops
        // the module's compiled Kotlin/Java API from the real compile
        // classpath if anything actually imports from it.
        //
        // So instead: for every subproject with one of the real runtime
        // configs, clone it (copyRecursive -- preserves attributes and
        // resolution strategy, so it resolves identically) and strip out only
        // the skip-listed projects' dependency entries from the CLONE. The
        // clone is scanned in place of the original; the original (and the
        // real build, which never references the clone) is untouched.
        def scanConfigNames = realConfigNames
        if (!skipProjects.isEmpty()) {
            t.setSkipProjects(skipProjects)

            def cloneNames = []
            root.subprojects.each { sub ->
                realConfigNames.each { realName ->
                    def real = sub.configurations.findByName(realName)
                    if (real != null && real.canBeResolved) {
                        def clone = real.copyRecursive()
                        clone.dependencies.removeIf { dep ->
                            dep instanceof ProjectDependency &&
                                    skipProjects.contains(dep.dependencyProject.name)
                        }
                        sub.configurations.add(clone)
                        cloneNames << clone.name
                    }
                }
            }
            if (!cloneNames.isEmpty()) {
                // Whitelist only the clones -- the real configs (still present
                // on every project) are implicitly excluded by not being listed.
                scanConfigNames = cloneNames
            }
        }
        t.setIncludeConfigs(scanConfigNames)
    }
}
