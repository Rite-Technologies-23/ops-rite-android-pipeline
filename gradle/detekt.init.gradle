// gradle/detekt.init.gradle
// Injects Detekt into ANY Kotlin/Android project WITHOUT modifying the calling repo.
//
// Provides in every module:
//   :<module>:detekt   -> lint run, reports in <module>/build/reports/detekt/
//
// Versions are overridable via env vars so CI can bump without editing this file.
//
// -----------------------------------------------------------------------------
// This runs detekt-cli directly via JavaExec, NOT detekt-gradle-plugin.
// DetektPlugin.apply() unconditionally registers a
// pluginManager.withPlugin("com.android.base") { ... } callback that fires once
// AGP applies to the project and references AGP's BaseExtension class. That
// class is loaded by AGP's own plugin classloader; DetektPlugin here is loaded
// from this initscript's isolated classpath, which can't see it ->
// NoClassDefFoundError on every module that applies com.android.application /
// com.android.library (e.g. app, hl7Core). This is the exact same
// classloader-isolation wall documented in dependency-analysis.init.gradle for
// DAGP, just tripped by a different plugin. Unlike DAGP, skipping Android
// modules isn't a workable answer here -- for a repo where every Kotlin module
// applies AGP, that would leave Detekt linting nothing.
//
// detekt-cli is a plain artifact with a runnable main class and no Gradle-API
// or AGP dependency at all, so invoking it directly as a JavaExec never
// touches DetektPlugin's Android-integration code path, and needs no
// direct declaration or other change in the caller repo.
// -----------------------------------------------------------------------------

import org.gradle.api.attributes.Usage

def detektVersion  = System.getenv("DETEKT_VERSION")        ?: "1.23.7"
def composeVersion = System.getenv("DETEKT_COMPOSE_VERSION") ?: "0.4.22"

// Detekt resolves detekt-cli + rule plugins from PROJECT repositories. Modern Android
// builds often set RepositoriesMode.FAIL_ON_PROJECT_REPOS, so inject at the settings
// level instead of calling allprojects { repositories { ... } }.
beforeSettings { settings ->
    settings.dependencyResolutionManagement {
        repositories {
            google()
            mavenCentral()
            gradlePluginPortal()
        }
    }
}

allprojects { Project p ->

    // Only Kotlin-bearing modules; skip the root aggregator if it has no sources.
    def hasKotlin = p.file("src/main/kotlin").exists() ||
            p.file("src/main/java").exists() ||
            !p.fileTree(dir: p.projectDir, includes: ["src/**/*.kt"]).empty

    if (!hasKotlin) {
        return
    }

    // One configuration for detekt-cli AND the Compose rule set (nlopez),
    // which registers the ruleset the shared detekt.yml's `Compose:` block
    // configures. ServiceLoader picks up its RuleSetProvider fine from a
    // plain classpath entry -- no need for --plugins, which exists for the
    // fixed-classpath CLI distribution, not for a caller-built classpath like
    // this one.
    //
    // The one real cost of merging them: io.nlopez.compose.rules:detekt's
    // "common" module pulls in kotlin-compiler-embeddable:2.0.21, while
    // detekt-cli 1.23.7 strictly requires 2.0.10 -- excluded below so
    // Gradle doesn't try to unify two incompatible pins. compose-rules only
    // uses that dependency for basic PSI traversal, which 2.0.10 (already on
    // this classpath via detekt-cli) provides just as well.
    def detektCliClasspath = p.configurations.maybeCreate("detektCliClasspath")
    detektCliClasspath.canBeConsumed = false
    detektCliClasspath.attributes {
        it.attribute(Usage.USAGE_ATTRIBUTE, p.objects.named(Usage, Usage.JAVA_RUNTIME))
    }
    p.dependencies.add("detektCliClasspath", "io.gitlab.arturbosch.detekt:detekt-cli:${detektVersion}")
    p.dependencies.add("detektCliClasspath", "io.nlopez.compose.rules:detekt:${composeVersion}") { dep ->
        dep.exclude(group: "org.jetbrains.kotlin", module: "kotlin-compiler-embeddable")
    }

    def reportDir = p.layout.buildDirectory.dir("reports/detekt")

    p.tasks.register("detekt", JavaExec) { t ->
        t.group = "verification"
        t.description = "Runs detekt-cli directly (bypasses detekt-gradle-plugin's Android integration)."

        t.mainClass.set("io.gitlab.arturbosch.detekt.cli.Main")
        t.classpath = detektCliClasspath

        t.doFirst {
            def srcDirs = p.files("src/main/java", "src/main/kotlin").filter { it.exists() }
            if (srcDirs.empty) {
                throw new GradleException("No src/main/{java,kotlin} found for ${p.path}")
            }

            def outDir = reportDir.get().asFile
            outDir.mkdirs()

            def cliArgs = [
                    "--input", srcDirs.files.collect { it.absolutePath }.join(","),
                    // buildUponDefaultConfig is what activates detekt's default rules that
                    // the shared config does not mention -- including the unused-code
                    // rules (UnusedPrivateMember / UnusedPrivateProperty / UnusedParameter).
                    "--build-upon-default-config",
                    "--parallel",
                    "--jvm-target", (System.getenv("JAVA_VERSION") ?: "17"),
                    "--report", "xml:${new File(outDir, 'detekt.xml').absolutePath}",
                    "--report", "html:${new File(outDir, 'detekt.html').absolutePath}",
                    "--report", "txt:${new File(outDir, 'detekt.txt').absolutePath}",
                    "--report", "sarif:${new File(outDir, 'detekt.sarif').absolutePath}",
            ]

            // DETEKT_CONFIG is an absolute path (or one relative to the root project)
            // pointing at the pipeline's shared .github/tool/detekt.yml.
            def cfg = System.getenv("DETEKT_CONFIG")
            if (cfg) {
                def cfgFile = new File(cfg)
                if (!cfgFile.isAbsolute()) {
                    cfgFile = p.rootProject.file(cfg)
                }
                if (cfgFile.exists()) {
                    cliArgs += ["--config", cfgFile.absolutePath]
                }
            }

            // Honour a caller-supplied baseline so existing debt does not block adoption.
            def baseline = p.file("detekt-baseline.xml")
            if (!baseline.exists()) {
                baseline = p.rootProject.file("detekt-baseline.xml")
            }
            if (baseline.exists()) {
                cliArgs += ["--baseline", baseline.absolutePath]
            }

            t.args = cliArgs
        }
    }
}
